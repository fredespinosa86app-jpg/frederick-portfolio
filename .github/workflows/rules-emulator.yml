# Runs the Firestore security-rules tests against Google's REAL rules engine (Firebase Local Emulator Suite).
# Free for public repositories. Needs no secrets and never touches your real Firebase project (demo project only).
# Start it from the repository's Actions tab (Run workflow), or it runs by itself when the rules or these tests change.
name: Firestore rules (emulator)
on:
  workflow_dispatch:
  push:
    paths: ['firestore.rules', 'firestore.rules.strict', 'rules-tests/emulator/**', 'rules-tests/attack/gen_worktrack_cases.mjs', 'scripts/core-worktrack.js', 'scripts/core-wtlog.js', 'scripts/core-billing.js', 'scripts/core-invoice.js', 'scripts/core-schedule.js', '.github/workflows/rules-emulator.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install test tools
        working-directory: rules-tests/emulator
        run: npm install --no-audit --no-fund
      - name: Run rules tests in the emulator
        working-directory: rules-tests/emulator
        run: npm test
